<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyCast — Modern Weather App</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #07111f;
      --bg2: #0d1d32;
      --card: rgba(255, 255, 255, 0.09);
      --card-hover: rgba(255, 255, 255, 0.13);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f7fbff;
      --muted: #9fb0c5;
      --accent: #66d9ff;
      --accent2: #7c6cff;
      --shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(102, 217, 255, 0.16), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(124, 108, 255, 0.17), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      pointer-events: none;
      z-index: -1;
    }

    body::before {
      background: #00d4ff;
      top: -140px;
      left: -100px;
      animation: floatOne 10s ease-in-out infinite alternate;
    }

    body::after {
      background: #7048ff;
      right: -100px;
      bottom: -160px;
      animation: floatTwo 12s ease-in-out infinite alternate;
    }

    @keyframes floatOne {
      to {
        transform: translate(100px, 70px);
      }
    }

    @keyframes floatTwo {
      to {
        transform: translate(-80px, -50px);
      }
    }

    .app {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 50px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      font-size: 25px;
      background: linear-gradient(135deg, #65dcff, #756cff);
      box-shadow: 0 12px 30px rgba(82, 182, 255, 0.28);
    }

    .brand h1 {
      font-size: 21px;
      letter-spacing: -0.5px;
    }

    .brand p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .location-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 12px 17px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.25s;
      backdrop-filter: blur(18px);
    }

    .location-btn:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    /* Search */
    .search-wrap {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box span {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 18px;
    }

    .search-box input {
      width: 100%;
      height: 54px;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 17px;
      padding: 0 18px 0 48px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      font-size: 15px;
      transition: 0.25s;
    }

    .search-box input:focus {
      border-color: rgba(102, 217, 255, 0.65);
      box-shadow: 0 0 0 4px rgba(102, 217, 255, 0.08);
    }

    .search-box input::placeholder {
      color: #7f91a8;
    }

    .search-btn {
      height: 54px;
      padding: 0 24px;
      border: none;
      border-radius: 17px;
      cursor: pointer;
      color: #06111e;
      font-weight: 800;
      background: linear-gradient(135deg, #65dcff, #8d80ff);
      transition: 0.25s;
      box-shadow: 0 12px 28px rgba(76, 177, 255, 0.2);
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 17px 35px rgba(76, 177, 255, 0.3);
    }

    /* Main weather */
    .hero {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .glass {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 27px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
    }

    .current {
      min-height: 390px;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .current::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      right: -100px;
      top: -100px;
      border-radius: 50%;
      background: rgba(100, 217, 255, 0.1);
      filter: blur(30px);
    }

    .place {
      color: var(--muted);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .place strong {
      color: var(--text);
      font-size: 18px;
    }

    .date {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .temperature-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 35px;
    }

    .temperature {
      font-size: clamp(70px, 10vw, 108px);
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: -7px;
      background: linear-gradient(180deg, #ffffff, #a7e8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .degree {
      font-size: 35px;
      vertical-align: top;
      letter-spacing: 0;
    }

    .weather-icon {
      width: 145px;
      height: 145px;
      object-fit: contain;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.25));
      animation: iconFloat 4s ease-in-out infinite;
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    .condition {
      font-size: 19px;
      font-weight: 700;
      margin-top: 15px;
    }

    .feels {
      color: var(--muted);
      margin-top: 5px;
      font-size: 13px;
    }

    .sun-row {
      display: flex;
      gap: 26px;
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
    }

    .sun-row b {
      color: var(--text);
      display: block;
      margin-top: 5px;
    }

    /* Highlights */
    .highlights {
      padding: 23px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .section-title {
      grid-column: 1 / -1;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .metric {
      min-height: 130px;
      padding: 18px;
      border-radius: 19px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.045);
      transition: 0.25s;
    }

    .metric:hover {
      background: rgba(255,255,255,0.085);
      transform: translateY(-3px);
    }

    .metric-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .metric-icon {
      font-size: 20px;
    }

    .metric-value {
      margin-top: 17px;
      font-size: 27px;
      font-weight: 800;
    }

    .metric-value small {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .metric-bar {
      width: 100%;
      height: 5px;
      margin-top: 12px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .metric-bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #5ddcff, #8278ff);
    }

    /* Forecast */
    .forecast {
      padding: 24px;
    }

    .forecast-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 17px;
    }

    .forecast-head h2 {
      font-size: 17px;
    }

    .forecast-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day {
      padding: 18px 10px;
      text-align: center;
      border-radius: 19px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.04);
      transition: 0.25s;
    }

    .day:first-child {
      background: linear-gradient(145deg, rgba(101,220,255,0.18), rgba(124,108,255,0.12));
      border-color: rgba(101,220,255,0.24);
    }

    .day:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.09);
    }

    .day-name {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .day-icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
      margin: 10px auto;
      display: block;
    }

    .day-temp {
      font-weight: 800;
      font-size: 15px;
    }

    .day-temp span {
      color: var(--muted);
      font-weight: 500;
      margin-left: 5px;
    }

    .rain {
      margin-top: 7px;
      font-size: 11px;
      color: #66d9ff;
    }

    /* Loading */
    .loading {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      background: rgba(3, 9, 17, 0.7);
      backdrop-filter: blur(10px);
    }

    .loading.show {
      display: grid;
    }

    .loader {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.12);
      border-top-color: #69dcff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error */
    .error {
      display: none;
      padding: 13px 16px;
      margin-bottom: 18px;
      border-radius: 14px;
      background: rgba(255, 77, 109, 0.1);
      border: 1px solid rgba(255, 77, 109, 0.25);
      color: #ff9bad;
      font-size: 13px;
    }

    .error.show {
      display: block;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .forecast-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 600px) {
      .app {
        width: min(100% - 20px, 1200px);
        padding-top: 20px;
      }

      header {
        margin-bottom: 20px;
      }

      .location-btn {
        padding: 10px 12px;
      }

      .brand-icon {
        width: 42px;
        height: 42px;
      }

      .search-wrap {
        flex-direction: column;
      }

      .search-btn {
        width: 100%;
      }

      .current {
        padding: 23px;
      }

      .temperature-row {
        margin-top: 28px;
      }

      .weather-icon {
        width: 105px;
        height: 105px;
      }

      .temperature {
        font-size: 72px;
      }

      .highlights {
        padding: 17px;
      }

      .forecast {
        padding: 18px;
      }

      .forecast-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .day {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="loading" id="loading">
    <div class="loader"></div>
  </div>

  <main class="app">

    <header>
      <div class="brand">
        <div class="brand-icon">☀️</div>
        <div>
          <h1>SkyCast</h1>
          <p>Beautiful weather, simplified.</p>
        </div>
      </div>

      <button class="location-btn" id="locationBtn">
        📍 My Location
      </button>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        <span>⌕</span>
        <input
          id="searchInput"
          type="text"
          placeholder="Search city... e.g. Delhi, Mumbai, London"
          autocomplete="off"
        />
      </div>

      <button class="search-btn" id="searchBtn">
        Search
      </button>
    </div>

    <div class="error" id="error"></div>

    <section class="hero">

      <div class="glass current">
        <div class="place">
          <span>📍</span>
          <strong id="cityName">Loading...</strong>
        </div>

        <div class="date" id="dateText">--</div>

        <div class="temperature-row">
          <div>
            <div class="temperature">
              <span id="temperature">--</span><span class="degree">°</span>
            </div>

            <div class="condition" id="condition">
              Loading weather...
            </div>

            <div class="feels">
              Feels like <strong id="feelsLike">--</strong>°
            </div>
          </div>

          <img
            class="weather-icon"
            id="weatherIcon"
            src=""
            alt="Weather"
          />
        </div>

        <div class="sun-row">
          <div>
            🌅 Sunrise
            <b id="sunrise">--</b>
          </div>

          <div>
            🌇 Sunset
            <b id="sunset">--</b>
          </div>
        </div>
      </div>

      <div class="glass highlights">

        <div class="section-title">
          Today's Highlights
        </div>

        <div class="metric">
          <div class="metric-top">
            <span>💧 Humidity</span>
            <span class="metric-icon">◉</span>
          </div>
          <div class="metric-value">
            <span id="humidity">--</span><small>%</small>
          </div>
          <div class="metric-bar">
            <span id="humidityBar" style="width: 0%"></span>
          </div>
        </div>

        <div class="metric">
          <div class="metric-top">
            <span>💨 Wind Speed</span>
            <span class="metric-icon">↝</span>
          </div>
          <div class="metric-value">
            <span id="wind">--</span>
            <small>km/h</small>
          </div>
        </div>

        <div class="metric">
          <div class="metric-top">
            <span>🌡️ Pressure</span>
            <span class="metric-icon">◌</span>
          </div>
          <div class="metric-value">
            <span id="pressure">--</span>
            <small>hPa</small>
          </div>
        </div>

        <div class="metric">
          <div class="metric-top">
            <span>👁️ Visibility</span>
            <span class="metric-icon">◎</span>
          </div>
          <div class="metric-value">
            <span id="visibility">--</span>
            <small>km</small>
          </div>
        </div>

      </div>

    </section>

    <section class="glass forecast">
      <div class="forecast-head">
        <h2>7-Day Forecast</h2>
        <span>Daily outlook</span>
      </div>

      <div class="forecast-grid" id="forecastGrid"></div>
    </section>

  </main>

  <script>
    const API = "https://api.open-meteo.com/v1/forecast";
    const GEO_API = "https://geocoding-api.open-meteo.com/v1/search";

    const els = {
      loading: document.getElementById("loading"),
      error: document.getElementById("error"),
      searchInput: document.getElementById("searchInput"),
      searchBtn: document.getElementById("searchBtn"),
      locationBtn: document.getElementById("locationBtn"),

      cityName: document.getElementById("cityName"),
      dateText: document.getElementById("dateText"),
      temperature: document.getElementById("temperature"),
      condition: document.getElementById("condition"),
      feelsLike: document.getElementById("feelsLike"),
      weatherIcon: document.getElementById("weatherIcon"),

      sunrise: document.getElementById("sunrise"),
      sunset: document.getElementById("sunset"),

      humidity: document.getElementById("humidity"),
      humidityBar: document.getElementById("humidityBar"),
      wind: document.getElementById("wind"),
      pressure: document.getElementById("pressure"),
      visibility: document.getElementById("visibility"),

      forecastGrid: document.getElementById("forecastGrid")
    };

    const weatherCodes = {
      0:  { text: "Clear Sky", icon: "☀️" },
      1:  { text: "Mainly Clear", icon: "🌤️" },
      2:  { text: "Partly Cloudy", icon: "⛅" },
      3:  { text: "Overcast", icon: "☁️" },
      45: { text: "Foggy", icon: "🌫️" },
      48: { text: "Rime Fog", icon: "🌫️" },
      51: { text: "Light Drizzle", icon: "🌦️" },
      53: { text: "Drizzle", icon: "🌦️" },
      55: { text: "Heavy Drizzle", icon: "🌧️" },
      56: { text: "Freezing Drizzle", icon: "🌧️" },
      57: { text: "Heavy Freezing Drizzle", icon: "🌧️" },
      61: { text: "Light Rain", icon: "🌦️" },
      63: { text: "Rain", icon: "🌧️" },
      65: { text: "Heavy Rain", icon: "🌧️" },
      66: { text: "Freezing Rain", icon: "🌧️" },
      67: { text: "Heavy Freezing Rain", icon: "🌧️" },
      71: { text: "Light Snow", icon: "🌨️" },
      73: { text: "Snow", icon: "🌨️" },
      75: { text: "Heavy Snow", icon: "❄️" },
      77: { text: "Snow Grains", icon: "❄️" },
      80: { text: "Light Showers", icon: "🌦️" },
      81: { text: "Showers", icon: "🌧️" },
      82: { text: "Heavy Showers", icon: "⛈️" },
      85: { text: "Snow Showers", icon: "🌨️" },
      86: { text: "Heavy Snow Showers", icon: "❄️" },
      95: { text: "Thunderstorm", icon: "⛈️" },
      96: { text: "Thunderstorm + Hail", icon: "⛈️" },
      99: { text: "Heavy Thunderstorm", icon: "⛈️" }
    };

    let currentLocation = {
      name: "New Delhi",
      latitude: 28.6139,
      longitude: 77.2090
    };

    function showLoading(show) {
      els.loading.classList.toggle("show", show);
    }

    function showError(message) {
      els.error.textContent = message;
      els.error.classList.add("show");
    }

    function hideError() {
      els.error.classList.remove("show");
    }

    function getWeatherInfo(code) {
      return weatherCodes[code] || {
        text: "Unknown",
        icon: "🌡️"
      };
    }

    function formatTime(dateString) {
      const date = new Date(dateString);

      return date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatDay(dateString, index) {
      if (index === 0) return "Today";

      return new Date(dateString + "T12:00:00")
        .toLocaleDateString([], {
          weekday: "short"
        });
    }

    function iconDataURI(emoji) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg"
             width="160"
             height="160"
             viewBox="0 0 160 160">
          <text x="80"
                y="112"
                text-anchor="middle"
                font-size="90">${emoji}</text>
        </svg>
      `;

      return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);
    }

    async function searchCity(city) {
      if (!city.trim()) {
        showError("Please enter a city name.");
        return;
      }

      hideError();
      showLoading(true);

      try {
        const url =
          `${GEO_API}?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Location search failed.");
        }

        const data = await response.json();

        if (!data.results || data.results.length === 0) {
          throw new Error(`Couldn't find "${city}". Try another city.`);
        }

        const result = data.results[0];

        currentLocation = {
          name: result.name,
          latitude: result.latitude,
          longitude: result.longitude
        };

        await loadWeather();
      } catch (error) {
        showError(error.message || "Something went wrong.");
      } finally {
        showLoading(false);
      }
    }

    async function loadWeather() {
      hideError();
      showLoading(true);

      try {
        const params = new URLSearchParams({
          latitude: currentLocation.latitude,
          longitude: currentLocation.longitude,

          current:
            "temperature_2m,relative_humidity_2m,apparent_temperature," +
            "weather_code,wind_speed_10m,surface_pressure,visibility",

          daily:
            "weather_code,temperature_2m_max,temperature_2m_min," +
            "precipitation_probability_max,sunrise,sunset",

          timezone: "auto",
          forecast_days: "7"
        });

        const response = await fetch(`${API}?${params}`);

        if (!response.ok) {
          throw new Error("Weather service is unavailable.");
        }

        const data = await response.json();

        renderWeather(data);

      } catch (error) {
        showError(
          error.message ||
          "Unable to load weather data. Please try again."
        );
      } finally {
        showLoading(false);
      }
    }

    function renderWeather(data) {
      const current = data.current;
      const daily = data.daily;
      const info = getWeatherInfo(current.weather_code);

      els.cityName.textContent = currentLocation.name;

      els.dateText.textContent =
        new Date(current.time).toLocaleDateString([], {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        });

      els.temperature.textContent =
        Math.round(current.temperature_2m);

      els.condition.textContent = info.text;

      els.feelsLike.textContent =
        Math.round(current.apparent_temperature);

      els.weatherIcon.src = iconDataURI(info.icon);

      els.humidity.textContent =
        Math.round(current.relative_humidity_2m);

      els.humidityBar.style.width =
        `${Math.min(100, current.relative_humidity_2m)}%`;

      els.wind.textContent =
        Math.round(current.wind_speed_10m);

      els.pressure.textContent =
        Math.round(current.surface_pressure);

      els.visibility.textContent =
        Math.max(
          0,
          (current.visibility / 1000)
        ).toFixed(1);

      els.sunrise.textContent =
        formatTime(daily.sunrise[0]);

      els.sunset.textContent =
        formatTime(daily.sunset[0]);

      renderForecast(daily);
    }

    function renderForecast(daily) {
      els.forecastGrid.innerHTML = "";

      daily.time.forEach((date, index) => {
        const info =
          getWeatherInfo(daily.weather_code[index]);

        const card = document.createElement("div");

        card.className = "day";

        card.innerHTML = `
          <div class="day-name">
            ${formatDay(date, index)}
          </div>

          <img
            class="day-icon"
            src="${iconDataURI(info.icon)}"
            alt="${info.text}"
          />

          <div class="day-temp">
            ${Math.round(daily.temperature_2m_max[index])}°
            <span>
              ${Math.round(daily.temperature_2m_min[index])}°
            </span>
          </div>

          <div class="rain">
            💧 ${daily.precipitation_probability_max[index] ?? 0}%
          </div>
        `;

        els.forecastGrid.appendChild(card);
      });
    }

    function useMyLocation() {
      if (!navigator.geolocation) {
        showError("Geolocation is not supported by this browser.");
        return;
      }

      hideError();
      showLoading(true);

      navigator.geolocation.getCurrentPosition(
        async position => {
          currentLocation = {
            name: "Your Location",
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          };

          await loadWeather();
        },
        error => {
          showLoading(false);

          let message =
            "Unable to access your location.";

          if (error.code === error.PERMISSION_DENIED) {
            message =
              "Location permission was denied. Please search for a city instead.";
          }

          showError(message);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 300000
        }
      );
    }

    els.searchBtn.addEventListener("click", () => {
      searchCity(els.searchInput.value);
    });

    els.searchInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        searchCity(els.searchInput.value);
      }
    });

    els.locationBtn.addEventListener("click", useMyLocation);

    // Initial weather
    loadWeather();
  </script>

</body>
</html>
